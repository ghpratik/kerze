[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerze"
version = "1.0.0"
description = "A pure-Python, zero-dependency tensor/autograd library built from scratch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Pratik Gaikwad", email = "pratik2000gaikwad@gmail.com" }
]
keywords = ["autograd", "tensor", "deep-learning", "machine-learning", "neural-network", "from-scratch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Intentionally empty — zero runtime dependencies is a core design goal.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/ghpratik/kerze"
Repository = "https://github.com/ghpratik/kerze"
Issues = "https://github.com/ghpratik/kerze/issues"

# ---------------------------------------------------------------------------
# Hatchling build config — tells the build backend where your actual
# package code lives (the src/ layout).
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/kerze"]

# ---------------------------------------------------------------------------
# Pytest config — adds src/ to sys.path so tests can `import kerze` without
# needing `pip install -e .` first (though editable install is still
# recommended for day-to-day development).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

# ---------------------------------------------------------------------------
# Coverage config (optional, useful once you have pytest-cov installed)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/kerze"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]